<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<title>找不到這一頁 · AI 學習中心</title>
<link rel="stylesheet" href="/css/hub.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

<header class="bar">
  <div class="bar__t">AI 學習中心</div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>找不到這一頁</h1>
    <p class="lede">網址可能打錯了，或這個頁面已經搬走。</p>
  </section>

  <a class="course" href="/">
    <div class="course__icon">🏠</div>
    <div class="course__body">
      <h2 class="course__t">回學習中心首頁</h2>
      <p class="course__d">看看目前有哪些課程。</p>
    </div>
  </a>

  <a class="course" href="/English-Phonics/">
    <div class="course__icon">🔤</div>
    <div class="course__body">
      <h2 class="course__t">English Phonics 拼讀教室</h2>
      <p class="course__d">見字能讀、聽音能寫。</p>
    </div>
  </a>
</main>

<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('hub.theme') || localStorage.getItem('phonics.theme'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</body>
</html>
